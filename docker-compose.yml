services:
  postgres:
    image: postgres:17-alpine
    container_name: staykey-postgres
    environment:
      POSTGRES_USER: staykey
      POSTGRES_PASSWORD: staykey
      POSTGRES_DB: staykey
    ports:
      - "5432:5432"
    volumes:
      - staykey-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staykey"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  staykey-pg:
