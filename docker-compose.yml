services:
  postgres:
    image: postgres:17-alpine
    container_name: staykey-postgres
    # Each parallel Go test migrates its own schema in a transaction, which holds a lock per new
    # object; on a many-core machine the default 64 runs out ("out of shared memory").
    command: postgres -c max_locks_per_transaction=256
    environment:
      POSTGRES_USER: staykey
      POSTGRES_PASSWORD: staykey
      POSTGRES_DB: staykey
    ports:
      - "5432:5432"
    volumes:
      - staykey-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U staykey"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  staykey-pg:
