openapi: 3.0.3
info:
  title: StayKey API
  version: 0.1.0
  description: |
    Contract for the StayKey backend. Owner endpoints live under /v1, public
    endpoints used by booking pages and the widget live under /v1/public.
    Money is always an integer amount in minor units (cents) with an ISO currency.

    Owner routes take a bearer access token and an X-Account-Id header naming the
    account to act on. A token for someone who is not a member of that account gets
    404, the same as an account that does not exist.
servers:
  - url: https://api.staykey.direct
    description: Production
  - url: http://localhost:8080
    description: Local development

tags:
  - name: system
  - name: auth
  - name: accounts
  - name: properties
  - name: uploads
  - name: bookings
  - name: calendar
  - name: team
  - name: activity
  - name: messages
  - name: billing
  - name: cards
  - name: public

paths:
  /healthz:
    get:
      tags: [system]
      operationId: getHealth
      summary: Service and database health
      responses:
        "200":
          description: Health status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"

  /v1/auth/otp:
    post:
      tags: [auth]
      operationId: requestOtp
      summary: Text a 6-digit sign-in code to a phone number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OtpRequest"
      responses:
        "200":
          description: The code was sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpSent"
        "400":
          $ref: "#/components/responses/BadRequest"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/auth/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      summary: Check a code and sign in, creating the user on first sign-in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyRequest"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignIn"
        "400":
          description: |
            The code is wrong (wrong_code), expired or already used (code_expired), or
            was guessed wrong too often (too_many_attempts).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      summary: Exchange a refresh token for new tokens
      description: |
        The refresh token rotates on every call. Presenting one that was already
        rotated revokes the session, except for a short grace period that lets a
        client retry a refresh whose response it never received.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          description: New tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: End the session behind a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "204":
          description: Signed out. Unknown tokens are accepted too.

  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in user and the accounts they belong to
      security:
        - bearerAuth: []
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [auth]
      operationId: updateMe
      summary: Update the signed-in user's profile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPatch"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/photo:
    post:
      tags: [auth]
      operationId: createMePhotoUpload
      summary: Get a link to upload the signed-in person's profile photo
      description: |
        PUT the file to the returned link, then send its key as photoKey in PATCH /v1/me. The
        photo belongs to the person, so it shows in every account they belong to.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvatarUploadRequest"
      responses:
        "201":
          description: Where to upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/me/deletion:
    post:
      tags: [auth]
      operationId: deleteMe
      summary: Delete the signed-in person and the accounts they own
      description: |
        Signs the person out everywhere, removes them from teams in other accounts, and closes
        the accounts they own, which takes their booking pages offline. Everything is deleted
        30 days later; signing in again with the same number before then restores it. confirm
        must be "DELETE". 409 store_plan_renews while an owned account's App Store or Google
        Play plan will renew.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeletionRequest"
      responses:
        "200":
          description: Deletion scheduled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deletion"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/me/email-confirmation:
    post:
      tags: [auth]
      operationId: resendEmailConfirmation
      summary: Send the confirmation link for the signed-in person's email again
      description: |
        Until the email is confirmed it gets no alerts, summaries or account emails. Limited to
        3 an hour. 409 email_confirmed when it already is; 400 no_email when there is none.
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sent
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/account:
    patch:
      tags: [accounts]
      operationId: renameAccount
      summary: Rename the account in X-Account-Id
      description: Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccountPatch"
      responses:
        "200":
          description: The renamed account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/account/export:
    get:
      tags: [accounts]
      operationId: exportAccount
      summary: Everything in the account, as one document
      description: |
        The account, its properties with their full setup (bank details included), every stay
        with its guest and payments, the team and the plan. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The export
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountExport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/accounts:
    get:
      tags: [accounts]
      operationId: listAccounts
      summary: Accounts the signed-in user belongs to
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Accounts, oldest membership first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccountList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [accounts]
      operationId: createAccount
      summary: Create an account with the signed-in user as its owner
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewAccount"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/properties:
    get:
      tags: [properties]
      operationId: listProperties
      summary: List the properties the caller can see
      description: Caretakers limited to some properties only see those.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: Properties, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PropertyList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [properties]
      operationId: createProperty
      summary: Create a property and its booking page address
      description: |
        Owners only, since a property counts towards the plan. Send baseRate for a
        quick start with one unit, or setup with the full setup as onboarding publishes
        it, all in one transaction.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewProperty"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The booking page address is already taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /v1/properties/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [properties]
      operationId: getProperty
      summary: A property with its full setup
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [properties]
      operationId: updateProperty
      summary: Change some of a property's setup
      description: |
        Send only the sections that changed. Lists (units, seasons, charges and so on)
        replace the whole list: items that carry the id of an existing item are updated,
        items with any other id are added, and items left out are removed. Units are
        archived rather than deleted. New units can be referred to by the id they were
        sent with from linkedUnitIds and season prices in the same request. Everything
        applies in one transaction. Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PropertyPatch"
      responses:
        "200":
          description: The updated property
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Property"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/uploads:
    post:
      tags: [uploads]
      operationId: createUpload
      summary: Get a link to upload a photo or logo
      description: |
        Returns a short-lived URL that accepts one file of exactly this type and size.
        PUT the file there with the returned headers, then send the key in a property's
        photos or branding.logoKey. Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequest"
      responses:
        "201":
          description: Where to upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/quote:
    post:
      tags: [bookings]
      operationId: createQuote
      summary: Price a stay
      description: |
        The breakdown the booking would store, priced with the property's rates, seasons,
        rate overrides, discounts, extras and charges. Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteRequest"
      responses:
        "200":
          description: The price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/bookings:
    get:
      tags: [bookings]
      operationId: listBookings
      summary: Stays the caller can see, by arrival
      description: |
        Stays that overlap [from, to), ordered by check-in. Pass nextCursor back as cursor
        for the next page. Caretakers see the properties they look after, without money.
      security:
        - bearerAuth: []
          accountHeader: []
      parameters:
        - name: propertyId
          in: query
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          schema:
            $ref: "#/components/schemas/Day"
        - name: to
          in: query
          schema:
            $ref: "#/components/schemas/Day"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        "200":
          description: A page of stays
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingList"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Add a stay the owner took directly
      description: |
        Prices the stay (or takes customTotal), holds its nights and confirms it, with an
        optional first payment. Nights another stay or a block holds give 409 with the
        clash. Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBooking"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/KeyReused"

  /v1/bookings/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    get:
      tags: [bookings]
      operationId: getBooking
      summary: One stay with its price lines, payments and slips
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The stay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [bookings]
      operationId: updateBooking
      summary: Change a stay
      description: |
        Send the version you read and the fields that changed. A change of unit, dates,
        guests or extras prices the stay again unless customTotal is sent. A stale version
        gives 409 with code stale. Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingPatch"
      responses:
        "200":
          description: The changed stay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/bookings/{bookingId}/transitions:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [bookings]
      operationId: transitionBooking
      summary: Move a stay to its next status
      description: |
        Approve or decline a request, confirm, check in or check out. Every role can check
        guests in and out; the rest is for owners and managers. Declining frees the nights.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Transition"
      responses:
        "200":
          description: The stay in its new status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/bookings/{bookingId}/cancel:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [bookings]
      operationId: cancelBooking
      summary: Cancel a stay and record any refund
      description: |
        Frees the nights. The refund is up to the owner, up to what was paid; the
        cancellation policy only suggests it. Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Cancellation"
      responses:
        "200":
          description: The cancelled stay
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/KeyReused"

  /v1/bookings/{bookingId}/payments:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [bookings]
      operationId: recordPayment
      summary: Record money the guest paid
      description: |
        Send slipId to accept the guest's bank slip with the payment. A payment on a stay
        awaiting payment confirms it. Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPayment"
      responses:
        "201":
          description: The stay with the payment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/KeyReused"

  /v1/bookings/{bookingId}/erase-guest:
    parameters:
      - $ref: "#/components/parameters/BookingId"
    post:
      tags: [bookings]
      operationId: eraseBookingGuest
      summary: Erase the details of the guest behind a stay
      description: |
        Replaces the guest's name with "Guest removed", clears their phone, email, country and
        notes on all their stays, and takes their name out of activity. The stays, prices and
        payments stay. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "204":
          description: Erased
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/slips/{slipId}/reject:
    parameters:
      - $ref: "#/components/parameters/SlipId"
    post:
      tags: [bookings]
      operationId: rejectSlip
      summary: Turn down a bank slip the guest uploaded
      description: Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The stay the slip belongs to
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/properties/{id}/calendar:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [calendar]
      operationId: getCalendar
      summary: Blocks and rate overrides for a stretch of nights
      description: |
        Nights in [from, to), the next twelve months by default. Stays come from
        /v1/bookings with the same propertyId, from and to.
      security:
        - bearerAuth: []
          accountHeader: []
      parameters:
        - name: from
          in: query
          schema:
            $ref: "#/components/schemas/Day"
        - name: to
          in: query
          schema:
            $ref: "#/components/schemas/Day"
      responses:
        "200":
          description: The calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Calendar"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/blocks:
    post:
      tags: [calendar]
      operationId: createBlock
      summary: Close nights on some units
      description: Nights a stay or another block holds give 409. Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBlock"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Block"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/blocks/{blockId}:
    parameters:
      - $ref: "#/components/parameters/BlockId"
    delete:
      tags: [calendar]
      operationId: deleteBlock
      summary: Open a block's nights again
      description: Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/rate-overrides:
    put:
      tags: [calendar]
      operationId: setRateOverrides
      summary: Set or clear the price and stay rules for some nights
      description: |
        Replaces the overrides on every unit and night in [from, to). Leave out price and
        minNights and send closedToArrival false to go back to the usual rates. Owners and
        managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateOverrideInput"
      responses:
        "204":
          description: Saved
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/ical-feeds/{feedId}/sync:
    parameters:
      - $ref: "#/components/parameters/FeedId"
    post:
      tags: [calendar]
      operationId: syncIcalFeed
      summary: Read an imported calendar again now
      description: |
        Marks the feed due, so the import job reads it within a minute. Returns the feed as it
        stands; fetch the property again shortly after for the result. Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The feed, due for a read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IcalFeed"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/team:
    get:
      tags: [team]
      operationId: getTeam
      summary: The account's members and open invites
      description: Every role can read the team.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: Members, owners first, and invites, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Team"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/team/invites:
    post:
      tags: [team]
      operationId: createInvite
      summary: Invite someone by phone as a manager or caretaker
      description: |
        Returns the invite link once; send it to the person on WhatsApp. A new invite to the
        same number replaces the open one. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewInvite"
      responses:
        "201":
          description: The invite and its link
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InviteCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/team/invites/{inviteId}:
    parameters:
      - $ref: "#/components/parameters/InviteId"
    delete:
      tags: [team]
      operationId: revokeInvite
      summary: Revoke an open invite so its link stops working
      description: Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "204":
          description: Revoked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/team/members/{membershipId}:
    parameters:
      - $ref: "#/components/parameters/MembershipId"
    patch:
      tags: [team]
      operationId: updateMember
      summary: Change a member's role or the properties they can see
      description: The owner's membership can't be changed. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberPatch"
      responses:
        "200":
          description: The member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [team]
      operationId: removeMember
      summary: Remove a member from the account
      description: The owner can't be removed. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "204":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/invites/accept:
    post:
      tags: [team]
      operationId: acceptInvite
      summary: Join the account an invite is for
      description: |
        The signed-in phone must be the invited one; any other number, or a used, revoked or
        expired invite, gets 404. Accepting again returns the same membership.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteToken"
      responses:
        "200":
          description: The account joined, with the caller's role in it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Account"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/activity:
    get:
      tags: [activity]
      operationId: listActivity
      summary: What happened in the account, newest first
      description: |
        Caretakers see their properties only, without payments or slips. Pass nextCursor
        back as cursor for the next page.
      security:
        - bearerAuth: []
          accountHeader: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
      responses:
        "200":
          description: A page of activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/activity/read:
    post:
      tags: [activity]
      operationId: markActivityRead
      summary: Mark everything up to now as read for the caller
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "204":
          description: Marked
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/templates:
    get:
      tags: [messages]
      operationId: listTemplates
      summary: The account's message templates
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The four templates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TemplateList"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/templates/{templateId}:
    parameters:
      - $ref: "#/components/parameters/TemplateId"
    patch:
      tags: [messages]
      operationId: updateTemplate
      summary: Change a template's text or channels
      description: Owners and managers only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TemplatePatch"
      responses:
        "200":
          description: The template
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Template"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/notification-prefs:
    get:
      tags: [messages]
      operationId: getNotificationPrefs
      summary: How the caller wants to hear about each event in this account
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: One entry per event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefs"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [messages]
      operationId: setNotificationPrefs
      summary: Replace the caller's preferences for the events sent
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationPrefs"
      responses:
        "200":
          description: Every event's preference after the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPrefs"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/push-tokens:
    post:
      tags: [messages]
      operationId: registerPushToken
      summary: Register this device's Expo push token for the signed-in session
      description: Signing out of the session stops alerts to the token.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushToken"
      responses:
        "204":
          description: Registered
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /v1/subscription:
    get:
      tags: [billing]
      operationId: getSubscription
      summary: The account's plan, free period and bookable units
      description: |
        Every role may read it; only owners may change it. The server decides access from
        RevenueCat and Payments.lk, so the app reads this rather than the store's entitlements.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The account's billing state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/subscription/refresh:
    post:
      tags: [billing]
      operationId: refreshSubscription
      summary: Read the account's store plans from RevenueCat now
      description: |
        For right after a purchase or a restore in the app, before RevenueCat's webhook arrives.
        Owners only. 503 billing_not_configured when RevenueCat isn't set up.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The account's billing state after the read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/subscription/checkout:
    post:
      tags: [billing]
      operationId: createCheckout
      summary: Start a web payment for one prepaid period
      description: |
        Returns the Payments.lk checkout to send the owner to. A period bought while another
        web period runs starts when that one ends. Owners only. 409 already_subscribed while an
        App Store or Google Play plan gives access; 503 billing_not_configured when Payments.lk
        isn't set up.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckoutRequest"
      responses:
        "201":
          description: The checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WebCheckout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/card-payments:
    get:
      tags: [cards]
      operationId: getCardPayments
      summary: Where the account's guest card payments go
      description: |
        The card mode, the owner's own Payments.lk connection (never its key) and whether this
        server offers StayKey payouts. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The account's card setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPayments"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/card-payments/mode:
    put:
      tags: [cards]
      operationId: setCardMode
      summary: Choose where guest card payments go
      description: |
        own takes payments on the owner's connected Payments.lk account; payouts takes them on
        StayKey's account and pays the owner by bank transfer. 409 payouts_unavailable when the
        server doesn't offer payouts or the payout details aren't complete. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardModeInput"
      responses:
        "200":
          description: The account's card setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPayments"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /v1/card-payments/connection:
    put:
      tags: [cards]
      operationId: connectCards
      summary: Connect the owner's own Payments.lk account
      description: |
        Checks the secret key with Payments.lk, then keeps it sealed. 400 invalid_key when
        Payments.lk refuses it or it isn't a secret key; 400 test_key_in_production on a live
        server; 503 payments_unreachable when Payments.lk can't be reached. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardConnectionInput"
      responses:
        "200":
          description: The account's card setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPayments"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
    delete:
      tags: [cards]
      operationId: disconnectCards
      summary: Forget the owner's Payments.lk key
      description: |
        Card payments stop until another key is connected or StayKey payouts are chosen.
        Refunds of earlier card payments then can't be sent. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The account's card setup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardPayments"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/card-payments/payout-profile:
    get:
      tags: [cards]
      operationId: getPayoutProfile
      summary: The owner's payout details for StayKey payouts
      description: |
        The NIC and account number come back as their last four characters only. 404 when no
        details have been given. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The payout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [cards]
      operationId: setPayoutProfile
      summary: Give or change the payout details
      description: |
        A legal name, NIC, and a bank account in the owner's own name, with the current payout
        terms accepted. Changing the bank, branch or account number holds the next payout for
        72 hours and tells the owner by email and in Activity. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayoutProfileInput"
      responses:
        "200":
          description: The payout details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/payouts:
    get:
      tags: [cards]
      operationId: getPayouts
      summary: StayKey payout balances and past payouts
      description: |
        Rupee cents. available is in the next payout, pending waits for stays to start, and
        onTheWay is in payouts prepared but not yet paid. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      responses:
        "200":
          description: The account's payouts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payouts"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /v1/payouts/{payoutId}:
    get:
      tags: [cards]
      operationId: getPayout
      summary: A payout's statement
      description: Each stay's payment, StayKey's processing charge, refunds and adjustments it paid. Owners only.
      security:
        - bearerAuth: []
          accountHeader: []
      parameters:
        - $ref: "#/components/parameters/PayoutId"
      responses:
        "200":
          description: The payout and its statement
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutStatement"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/revenuecat:
    post:
      tags: [billing]
      operationId: revenueCatWebhook
      summary: Subscription events from RevenueCat
      description: |
        Checked against the Authorization value set in RevenueCat's dashboard. The event only
        says which account changed; the plan is read back from RevenueCat.
      parameters:
        - name: Authorization
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Received
        "401":
          $ref: "#/components/responses/Unauthorized"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /webhooks/payments-lk:
    post:
      tags: [billing]
      operationId: paymentsLkWebhook
      summary: Payment events from Payments.lk
      description: Verified with the Payments-Signature header against the raw body.
      parameters:
        - name: Payments-Signature
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Received
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /webhooks/ses:
    post:
      tags: [messages]
      operationId: sesWebhook
      summary: Bounces and complaints from AWS SES, through SNS
      description: |
        The SNS signature is checked against a certificate from sns.<region>.amazonaws.com. A
        subscription is confirmed once; permanent bounces and complaints suppress the address.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Received
        "400":
          $ref: "#/components/responses/BadRequest"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/public/email-confirmation:
    post:
      tags: [public]
      operationId: confirmEmail
      summary: Confirm an email address with the token from its link
      description: |
        The token travels in the body so it stays out of access logs. A link works once and
        lasts 7 days; 404 for an unknown, used or expired one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailConfirmationToken"
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConfirmedEmail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/public/plans:
    get:
      tags: [billing]
      operationId: listPlans
      summary: Plans and their web prices
      description: |
        Web prices are in LKR, the only currency Payments.lk takes. App Store and Google Play
        prices are set in the stores.
      responses:
        "200":
          description: The plans, smallest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanList"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/public/invites/preview:
    post:
      tags: [public]
      operationId: previewInvite
      summary: What an invite link is for, before the person signs in
      description: The token travels in the body so it stays out of access logs.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InviteToken"
      responses:
        "200":
          description: The invite
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvitePreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/public/properties/{slug}:
    get:
      tags: [public]
      operationId: getPublicProperty
      summary: Public details for a property's booking page
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Slug"
      responses:
        "200":
          description: Public property details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicProperty"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/public/properties/{slug}/availability:
    parameters:
      - $ref: "#/components/parameters/PropertySlug"
    get:
      tags: [public]
      operationId: getPublicAvailability
      summary: Nights each unit can't be booked, and days guests can't arrive
      description: |
        Nights in [from, to) that a stay, block or checkout hold takes, per unit, through
        linked units. The range is at most 13 months.
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Day"
        - name: to
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/Day"
      responses:
        "200":
          description: Availability per unit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Availability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/public/properties/{slug}/quote:
    parameters:
      - $ref: "#/components/parameters/PropertySlug"
    post:
      tags: [public]
      operationId: createPublicQuote
      summary: Price a stay a guest is choosing
      description: |
        Checks the property's stay rules and the promo code, then prices the stay. A broken rule
        is 400 with the field it is about.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicQuoteRequest"
      responses:
        "200":
          description: The price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/public/properties/{slug}/holds:
    parameters:
      - $ref: "#/components/parameters/PropertySlug"
    post:
      tags: [public]
      operationId: createHold
      summary: Hold nights while the guest fills in the checkout
      description: |
        Holds the nights for the property's holdMinutes. replaces releases the guest's previous
        hold first. Taken nights give 409 dates_taken, with nothing about the other stay.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewHold"
      responses:
        "201":
          description: Held
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hold"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "409":
          $ref: "#/components/responses/PublicConflict"

  /v1/public/properties/{slug}/bookings:
    parameters:
      - $ref: "#/components/parameters/PropertySlug"
    post:
      tags: [public]
      operationId: createGuestBooking
      summary: Book a stay from the booking page or widget
      description: |
        Books the held nights (or the nights asked for, when they are free) under the property's
        booking mode. The token in the reply is the guest's only way back to the booking; it is
        not shown again.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestBookingRequest"
      responses:
        "201":
          description: Booked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestBookingCreated"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "409":
          $ref: "#/components/responses/PublicConflict"
        "422":
          $ref: "#/components/responses/KeyReused"

  /v1/public/bookings/{bookingId}:
    parameters:
      - $ref: "#/components/parameters/BookingId"
      - $ref: "#/components/parameters/BookingToken"
    get:
      tags: [public]
      operationId: getGuestBooking
      summary: A guest's own booking
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestBooking"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/public/bookings/{bookingId}/uploads:
    parameters:
      - $ref: "#/components/parameters/BookingId"
      - $ref: "#/components/parameters/BookingToken"
    post:
      tags: [public]
      operationId: createGuestUpload
      summary: Get a link to upload a bank slip
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestUploadRequest"
      responses:
        "201":
          description: Where to upload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadTicket"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /v1/public/bookings/{bookingId}/slips:
    parameters:
      - $ref: "#/components/parameters/BookingId"
      - $ref: "#/components/parameters/BookingToken"
    post:
      tags: [public]
      operationId: addGuestSlip
      summary: Send an uploaded bank slip to the owner
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuestSlipInput"
      responses:
        "201":
          description: The booking with the slip
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestBooking"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "409":
          $ref: "#/components/responses/PublicConflict"

  /v1/public/bookings/{bookingId}/card-checkout:
    parameters:
      - $ref: "#/components/parameters/BookingId"
      - $ref: "#/components/parameters/BookingToken"
    post:
      tags: [public]
      operationId: createCardCheckout
      summary: Start a card payment for the stay
      description: |
        Returns the Payments.lk checkout to send the guest to, reusing an open one for the same
        amount. deposit and full pay a stay waiting for payment; balance pays what is left on a
        confirmed stay. 409 bad_status, cards_off or nothing_to_pay; 503 payments_unreachable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CardCheckoutRequest"
      responses:
        "201":
          description: The checkout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CardCheckout"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/PublicConflict"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"

  /v1/public/bookings/{bookingId}/card-checkout/check:
    parameters:
      - $ref: "#/components/parameters/BookingId"
      - $ref: "#/components/parameters/BookingToken"
    post:
      tags: [public]
      operationId: checkCardCheckout
      summary: Ask Payments.lk about the stay's open checkouts now
      description: For the stay page when the guest comes back from paying.
      responses:
        "200":
          description: The booking after the check
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuestBooking"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /ical/{file}:
    get:
      tags: [public]
      operationId: getIcalExport
      summary: The property's calendar for OTAs to import
      description: |
        file is the property's slug, a dash, its export token and .ics. Every taken night, as
        "Booked" or "Not available", with nothing about guests. unit limits it to the nights
        that unit can't be sold.
      parameters:
        - name: file
          in: path
          required: true
          schema:
            type: string
            example: kingfisher-3f9a1c2b.ics
        - name: unit
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The calendar
          content:
            text/calendar:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from /v1/auth/verify or /v1/auth/refresh. Lasts 15 minutes.
    accountHeader:
      type: apiKey
      in: header
      name: X-Account-Id
      description: The account an owner route acts on. The caller must be an active member.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PayoutId:
      name: payoutId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SlipId:
      name: slipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    BlockId:
      name: blockId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    InviteId:
      name: inviteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TemplateId:
      name: templateId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FeedId:
      name: feedId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PropertySlug:
      name: slug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Slug"
    BookingToken:
      name: X-Booking-Token
      in: header
      required: true
      description: The token returned when the guest booked.
      schema:
        type: string
        minLength: 1
        maxLength: 100
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        Any unique string, such as a UUID made when the form opened. A retry with the same
        key and body gets the first reply; the same key with another body gets 422. Keys
        last 24 hours.
      schema:
        type: string
        minLength: 1
        maxLength: 200

  responses:
    Unauthorized:
      description: The access token is missing, invalid, expired or revoked
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: The caller's role does not allow this
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Too many requests. Retry after the number of seconds in retryAfter.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    BadRequest:
      description: The request was invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

    Conflict:
      description: |
        The nights are taken (code dates_taken, with the clash), the stay changed since it
        was read (code stale), or its status doesn't allow this (code bad_status).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConflictError"
    PublicConflict:
      description: |
        The nights are taken (code dates_taken), the property isn't taking bookings
        (not_taking_bookings), the stay takes no more slips or payments (bad_status), cards are
        off (cards_off), or nothing is left to pay (nothing_to_pay). Nothing about other stays
        is included.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ServiceUnavailable:
      description: A provider this needs isn't set up on the server (code billing_not_configured)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    KeyReused:
      description: The Idempotency-Key was already used for a different request
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]

    Phone:
      type: string
      description: Phone number with its country code. Returned in E.164, for example +94771234567.
      example: "+94771234567"

    OtpRequest:
      type: object
      required: [phone]
      properties:
        phone:
          $ref: "#/components/schemas/Phone"

    OtpSent:
      type: object
      required: [phone, expiresAt, resendAfter]
      properties:
        phone:
          $ref: "#/components/schemas/Phone"
        expiresAt:
          type: string
          format: date-time
        resendAfter:
          type: integer
          description: Seconds before another code can be requested.
          example: 30
        devCode:
          type: string
          description: The code itself. Development servers only, so test devices can sign in.

    VerifyRequest:
      type: object
      required: [phone, code]
      properties:
        phone:
          $ref: "#/components/schemas/Phone"
        code:
          type: string
          pattern: "^[0-9]{6}$"
          example: "482913"
        deviceName:
          type: string
          maxLength: 80
          description: Shown in the list of signed-in devices.
          example: Nimal's iPhone

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    AuthTokens:
      type: object
      required: [accessToken, accessTokenExpiresAt, refreshToken, refreshTokenExpiresAt]
      properties:
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time

    SignIn:
      type: object
      required: [tokens, user, accounts, newUser]
      properties:
        tokens:
          $ref: "#/components/schemas/AuthTokens"
        user:
          $ref: "#/components/schemas/User"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"
        newUser:
          type: boolean
          description: True when this sign-in created the user.

    Language:
      type: string
      enum: [en, si]

    User:
      type: object
      required: [id, phone, name, emailConfirmed, language, createdAt]
      properties:
        id:
          type: string
          format: uuid
        phone:
          $ref: "#/components/schemas/Phone"
        name:
          type: string
        email:
          type: string
        emailConfirmed:
          type: boolean
          description: |
            Whether the email was confirmed from its link. An unconfirmed email gets nothing
            but the confirmation itself.
        language:
          $ref: "#/components/schemas/Language"
        photoUrl:
          type: string
          nullable: true
          description: The profile photo, when there is one.
        createdAt:
          type: string
          format: date-time

    UserPatch:
      type: object
      properties:
        name:
          type: string
          maxLength: 80
        email:
          type: string
          maxLength: 254
          description: |
            An empty string clears the email. A new or changed email is sent a confirmation link
            and isn't used until it is confirmed.
        language:
          $ref: "#/components/schemas/Language"
        photoKey:
          type: string
          description: A key from POST /v1/me/photo. An empty string removes the photo.

    AvatarUploadRequest:
      type: object
      required: [contentType, size]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic]
        size:
          type: integer
          format: int64
          minimum: 1
          description: Exact size in bytes, up to 5 MB.

    DeletionRequest:
      type: object
      required: [confirm]
      properties:
        confirm:
          type: string
          description: Must be "DELETE".

    Deletion:
      type: object
      required: [deletesAt]
      properties:
        deletesAt:
          type: string
          format: date-time
          description: When the person and their accounts are deleted for good.

    AccountPatch:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    AccountExport:
      type: object
      required: [exportedAt, account, properties, bookings, team, subscription]
      properties:
        exportedAt:
          type: string
          format: date-time
        account:
          $ref: "#/components/schemas/Account"
        properties:
          type: array
          items:
            $ref: "#/components/schemas/Property"
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        team:
          $ref: "#/components/schemas/Team"
        subscription:
          $ref: "#/components/schemas/Subscription"

    Me:
      type: object
      required: [user, accounts]
      properties:
        user:
          $ref: "#/components/schemas/User"
        accounts:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    Role:
      type: string
      enum: [owner, manager, caretaker]

    AccountStatus:
      type: string
      enum: [trial, active, grace, lapsed, closed]

    Account:
      type: object
      description: An account as the signed-in user sees it, with their role in it.
      required: [id, name, status, role, propertyIds, trialStartedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          $ref: "#/components/schemas/AccountStatus"
        role:
          $ref: "#/components/schemas/Role"
        propertyIds:
          type: array
          description: The properties this member is limited to. Empty means every property.
          items:
            type: string
            format: uuid
        trialStartedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    AccountList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Account"

    NewAccount:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          example: Kingfisher Villa

    Slug:
      type: string
      description: Lowercase subdomain label used for the booking page, for example "kingfisher" in kingfisher.staykey.direct.
      pattern: "^[a-z0-9](?:[a-z0-9-]{1,38}[a-z0-9])$"
      example: kingfisher

    BookingType:
      type: string
      description: Whether guests book the whole place or individual rooms.
      enum: [entire, rooms]

    Currency:
      type: string
      enum: [USD, LKR, EUR, GBP]

    NewProperty:
      type: object
      required: [name, bookingType, currency]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
          example: Kingfisher Villa
        slug:
          $ref: "#/components/schemas/Slug"
        bookingType:
          $ref: "#/components/schemas/BookingType"
        location:
          type: string
          maxLength: 160
          example: Unawatuna, Galle
        currency:
          $ref: "#/components/schemas/Currency"
        baseRate:
          type: integer
          format: int64
          minimum: 1
          description: Nightly rate in minor units for the one unit a quick start gets. Required without setup.units.
          example: 18000
        setup:
          $ref: "#/components/schemas/PropertyPatch"

    Money:
      type: integer
      format: int64
      minimum: 0
      description: An amount in minor units of the property's currency.

    Property:
      type: object
      description: A property with its full setup, as owners and managers see it.
      required: [id, slug, name, bookingType, currency, baseRate, bookingPageUrl, createdAt,
                 description, amenities, checkIn, checkOut, timeZone, photos, units, extraGuest,
                 seasons, lengthDiscounts, rules, policy, depositPercent, balanceDueDays,
                 houseRules, charges, extras, promos, payments, booking, branding, icalFeeds,
                 icalExportToken]
      properties:
        id:
          type: string
          format: uuid
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        bookingType:
          $ref: "#/components/schemas/BookingType"
        location:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        baseRate:
          type: integer
          format: int64
          description: The lowest unit rate, in minor units.
        bookingPageUrl:
          type: string
          format: uri
          example: https://kingfisher.staykey.direct
        createdAt:
          type: string
          format: date-time
        description:
          type: string
        amenities:
          type: array
          items:
            type: string
        checkIn:
          $ref: "#/components/schemas/Clock"
        checkOut:
          $ref: "#/components/schemas/Clock"
        timeZone:
          type: string
          example: Asia/Colombo
        photos:
          type: array
          description: In display order; the first is the cover.
          items:
            $ref: "#/components/schemas/Photo"
        units:
          type: array
          items:
            $ref: "#/components/schemas/Unit"
        extraGuest:
          $ref: "#/components/schemas/ExtraGuest"
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/Season"
        lengthDiscounts:
          type: array
          items:
            $ref: "#/components/schemas/LengthDiscount"
        rules:
          $ref: "#/components/schemas/StayRules"
        policy:
          $ref: "#/components/schemas/Policy"
        depositPercent:
          type: integer
        balanceDueDays:
          type: integer
        houseRules:
          type: array
          items:
            type: string
        charges:
          type: array
          items:
            $ref: "#/components/schemas/Charge"
        extras:
          type: array
          items:
            $ref: "#/components/schemas/Extra"
        promos:
          type: array
          items:
            $ref: "#/components/schemas/Promo"
        payments:
          $ref: "#/components/schemas/PaymentSettings"
        booking:
          $ref: "#/components/schemas/BookingSettings"
        branding:
          $ref: "#/components/schemas/Branding"
        icalFeeds:
          type: array
          items:
            $ref: "#/components/schemas/IcalFeed"
        icalExportToken:
          type: string
          description: Secret part of the calendar export link for OTAs.

    PropertyPatch:
      type: object
      description: Sections to change. Absent sections stay as they are; lists replace the whole list.
      properties:
        name:
          type: string
        bookingType:
          $ref: "#/components/schemas/BookingType"
        description:
          type: string
          maxLength: 2000
        location:
          type: string
        checkIn:
          $ref: "#/components/schemas/Clock"
        checkOut:
          $ref: "#/components/schemas/Clock"
        amenities:
          type: array
          items:
            type: string
        policy:
          $ref: "#/components/schemas/Policy"
        depositPercent:
          type: integer
          minimum: 0
          maximum: 100
        balanceDueDays:
          type: integer
          minimum: 0
          maximum: 90
        houseRules:
          type: array
          items:
            type: string
        rules:
          $ref: "#/components/schemas/StayRules"
        booking:
          $ref: "#/components/schemas/BookingSettings"
        branding:
          $ref: "#/components/schemas/BrandingInput"
        payments:
          $ref: "#/components/schemas/PaymentSettings"
        extraGuest:
          $ref: "#/components/schemas/ExtraGuest"
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitInput"
        seasons:
          type: array
          items:
            $ref: "#/components/schemas/SeasonInput"
        lengthDiscounts:
          type: array
          items:
            $ref: "#/components/schemas/LengthDiscount"
        charges:
          type: array
          items:
            $ref: "#/components/schemas/ChargeInput"
        extras:
          type: array
          items:
            $ref: "#/components/schemas/ExtraInput"
        promos:
          type: array
          items:
            $ref: "#/components/schemas/PromoInput"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/PhotoInput"
        icalFeeds:
          type: array
          items:
            $ref: "#/components/schemas/IcalFeedInput"

    Clock:
      type: string
      pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$"
      example: "14:00"

    Day:
      type: string
      format: date
      example: "2026-12-01"

    MonthDay:
      type: string
      pattern: "^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$"
      description: Month and day, repeating every year.
      example: "12-15"

    Policy:
      type: string
      enum: [flexible, moderate, strict]

    Photo:
      type: object
      required: [id, key, url, caption]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        url:
          type: string
          format: uri
        caption:
          type: string

    PhotoInput:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: The key from /v1/uploads, or of a photo the property already has.
        caption:
          type: string
          maxLength: 120

    Unit:
      type: object
      required: [id, name, sleeps, beds, rate, linkedUnitIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sleeps:
          type: integer
        beds:
          type: string
        rate:
          $ref: "#/components/schemas/Money"
        weekendRate:
          $ref: "#/components/schemas/Money"
        linkedUnitIds:
          type: array
          description: Rooms a whole-house unit books together.
          items:
            type: string
            format: uuid

    UnitInput:
      type: object
      required: [id, name, sleeps, rate]
      properties:
        id:
          type: string
          description: An existing unit's id, or any text unique in the request for a new unit.
        name:
          type: string
          maxLength: 60
        sleeps:
          type: integer
          minimum: 1
          maximum: 30
        beds:
          type: string
          maxLength: 80
        rate:
          $ref: "#/components/schemas/Money"
        weekendRate:
          $ref: "#/components/schemas/Money"
        linkedUnitIds:
          type: array
          items:
            type: string

    ExtraGuest:
      type: object
      description: A charge per guest per night above the included guests. Amount 0 is off.
      required: [above, amount]
      properties:
        above:
          type: integer
          minimum: 0
          maximum: 30
        amount:
          $ref: "#/components/schemas/Money"

    Season:
      type: object
      required: [id, name, start, end, prices]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        start:
          $ref: "#/components/schemas/MonthDay"
        end:
          $ref: "#/components/schemas/MonthDay"
        minNights:
          type: integer
        prices:
          type: object
          description: Nightly price per unit id.
          additionalProperties:
            type: integer
            format: int64

    SeasonInput:
      type: object
      required: [name, start, end, prices]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 60
        start:
          $ref: "#/components/schemas/MonthDay"
        end:
          $ref: "#/components/schemas/MonthDay"
        minNights:
          type: integer
          minimum: 1
          maximum: 30
        prices:
          type: object
          description: Nightly price per unit id, or per new unit's id from the same request.
          additionalProperties:
            type: integer
            format: int64

    LengthDiscount:
      type: object
      required: [nights, percent]
      properties:
        nights:
          type: integer
          minimum: 2
        percent:
          type: integer
          minimum: 1
          maximum: 90

    StayRules:
      type: object
      required: [minNights, maxNights, sameDayCutoff, windowMonths, closedArrival]
      properties:
        minNights:
          type: integer
          minimum: 1
          maximum: 30
        maxNights:
          type: integer
          maximum: 365
        sameDayCutoff:
          type: integer
          nullable: true
          minimum: 0
          maximum: 23
          description: Hour until which same-day arrivals can book. Null turns them off.
        windowMonths:
          type: integer
          minimum: 1
          maximum: 24
        closedArrival:
          type: array
          description: Weekdays guests can't arrive on, 0 for Sunday.
          items:
            type: integer
            minimum: 0
            maximum: 6

    ChargeKind:
      type: string
      enum: [percent, fixed]

    Charge:
      type: object
      required: [id, name, kind, amount, per, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ChargeKind"
        amount:
          type: integer
          format: int64
          description: A whole percent, or minor units for fixed charges.
        per:
          type: string
          enum: [stay, night, guest]
        enabled:
          type: boolean
        note:
          type: string

    ChargeInput:
      type: object
      required: [name, kind, amount, per, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          $ref: "#/components/schemas/ChargeKind"
        amount:
          type: integer
          format: int64
        per:
          type: string
          enum: [stay, night, guest]
        enabled:
          type: boolean
        note:
          type: string

    ExtraPer:
      type: string
      enum: [stay, night, guest, trip, guestNight]

    Extra:
      type: object
      required: [id, name, price, per, onRequest, enabled]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        per:
          $ref: "#/components/schemas/ExtraPer"
        onRequest:
          type: boolean
        enabled:
          type: boolean

    ExtraInput:
      type: object
      required: [name, price, per, onRequest, enabled]
      properties:
        id:
          type: string
        name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        per:
          $ref: "#/components/schemas/ExtraPer"
        onRequest:
          type: boolean
        enabled:
          type: boolean

    Promo:
      type: object
      required: [id, code, kind, amount, used]
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        kind:
          $ref: "#/components/schemas/ChargeKind"
        amount:
          type: integer
          format: int64
        from:
          $ref: "#/components/schemas/Day"
        to:
          $ref: "#/components/schemas/Day"
        limit:
          type: integer
        used:
          type: integer
          description: Bookings that used the code. Kept by the server.
        minNights:
          type: integer
        note:
          type: string

    PromoInput:
      type: object
      required: [code, kind, amount]
      properties:
        id:
          type: string
        code:
          type: string
          example: MONSOON10
        kind:
          $ref: "#/components/schemas/ChargeKind"
        amount:
          type: integer
          format: int64
        from:
          $ref: "#/components/schemas/Day"
        to:
          $ref: "#/components/schemas/Day"
        limit:
          type: integer
          minimum: 1
        minNights:
          type: integer
          minimum: 1
        note:
          type: string

    BankDetails:
      type: object
      required: [enabled, bankName, accountName, accountNumber, payWithinHours, cancelIfUnpaid]
      properties:
        enabled:
          type: boolean
        bankName:
          type: string
        accountName:
          type: string
        accountNumber:
          type: string
          description: Encrypted at rest. Hidden from caretakers.
        payWithinHours:
          type: integer
          minimum: 1
          maximum: 168
        cancelIfUnpaid:
          type: boolean

    PaymentSettings:
      type: object
      required: [bank, atProperty, cards]
      properties:
        bank:
          $ref: "#/components/schemas/BankDetails"
        atProperty:
          type: boolean
        cards:
          type: string
          enum: ["off", pending, "on"]
          description: |
            Send off or on. Read back, on means guests can pay by card now and pending means
            cards are switched on but something in cardsMissing keeps them from working.
        cardCharge:
          type: string
          enum: [deposit, full]
          description: What a card pays when a guest books. Defaults to deposit.
        cardRate:
          type: integer
          format: int64
          minimum: 0
          maximum: 10000000
          description: |
            Rupee cents per 1.00 of the property's currency, for card checkouts, which are in
            rupees. Needed unless the property is priced in LKR; 0 or absent means unset.
        cardsMissing:
          type: array
          readOnly: true
          description: What keeps cards from working, when they are switched on.
          items:
            type: string
            enum: [mode, connection, payout_profile, rate]

    BookingSettings:
      type: object
      required: [mode, replyHours, holdMinutes, displayCurrencies]
      properties:
        mode:
          type: string
          enum: [instant, request]
        replyHours:
          type: integer
          minimum: 1
          maximum: 72
        holdMinutes:
          type: integer
          minimum: 5
          maximum: 120
        displayCurrencies:
          type: array
          items:
            type: string
            enum: [USD, EUR, GBP, AUD, INR, LKR]

    Branding:
      type: object
      required: [color]
      properties:
        color:
          type: string
          example: "#09090b"
        logoKey:
          type: string
        logoUrl:
          type: string
          format: uri

    BrandingInput:
      type: object
      required: [color]
      properties:
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
        logoKey:
          type: string
          description: A key from /v1/uploads, or the current logo's. Leave out to remove the logo.

    IcalChannel:
      type: string
      enum: [airbnb, booking, agoda, expedia, other]

    IcalFeed:
      type: object
      required: [id, channel, url, status, upcoming]
      properties:
        id:
          type: string
          format: uuid
        channel:
          $ref: "#/components/schemas/IcalChannel"
        url:
          type: string
        unitId:
          type: string
          format: uuid
          nullable: true
          description: The unit the calendar is for. Null covers the whole property.
        status:
          type: string
          enum: [pending, ok, error]
          description: Pending until the import worker has read the link.
        lastSync:
          type: string
          format: date-time
        error:
          type: string
        upcoming:
          type: integer
          description: Imported stays from today on.

    IcalFeedInput:
      type: object
      required: [channel, url]
      properties:
        id:
          type: string
        channel:
          $ref: "#/components/schemas/IcalChannel"
        url:
          type: string
          maxLength: 1000
        unitId:
          type: string
          nullable: true
          description: The unit the calendar is for, as an id or a new unit's id in the same request. Null covers the whole property.

    UploadRequest:
      type: object
      required: [kind, contentType, size]
      properties:
        kind:
          type: string
          enum: [photo, logo]
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic]
        size:
          type: integer
          format: int64
          minimum: 1
          description: Exact size in bytes. Photos up to 15 MB, logos up to 5 MB.

    UploadTicket:
      type: object
      required: [key, uploadUrl, method, headers, expiresAt, url]
      properties:
        key:
          type: string
        uploadUrl:
          type: string
          format: uri
        method:
          type: string
          enum: [PUT]
        headers:
          type: object
          description: Headers to send with the upload, exactly as given.
          additionalProperties:
            type: string
        expiresAt:
          type: string
          format: date-time
        url:
          type: string
          format: uri
          description: Where the file is served once uploaded.

    PropertyList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Property"

    PublicProperty:
      type: object
      description: What a booking page shows, with no bank details, promos or feeds.
      required: [slug, name, bookingType, currency, baseRate, description, amenities, photos,
                 checkIn, checkOut, timeZone, houseRules, policy, depositPercent, units, extras,
                 rules, booking, payments, branding, takingBookings]
      properties:
        slug:
          $ref: "#/components/schemas/Slug"
        name:
          type: string
        bookingType:
          $ref: "#/components/schemas/BookingType"
        location:
          type: string
        currency:
          $ref: "#/components/schemas/Currency"
        baseRate:
          type: integer
          format: int64
        description:
          type: string
        amenities:
          type: array
          items:
            type: string
        photos:
          type: array
          description: In display order; the first is the cover.
          items:
            $ref: "#/components/schemas/PublicPhoto"
        checkIn:
          $ref: "#/components/schemas/Clock"
        checkOut:
          $ref: "#/components/schemas/Clock"
        timeZone:
          type: string
        houseRules:
          type: array
          items:
            type: string
        policy:
          $ref: "#/components/schemas/Policy"
        depositPercent:
          type: integer
        units:
          type: array
          items:
            $ref: "#/components/schemas/PublicUnit"
        extras:
          type: array
          description: Enabled extras only.
          items:
            $ref: "#/components/schemas/PublicExtra"
        rules:
          $ref: "#/components/schemas/StayRules"
        booking:
          $ref: "#/components/schemas/PublicBookingSettings"
        payments:
          $ref: "#/components/schemas/PublicPayments"
        branding:
          $ref: "#/components/schemas/PublicBranding"
        takingBookings:
          type: boolean
          description: False when the property is paused, offers no way to pay, or its plan lapsed.
        pausedReason:
          type: string
          nullable: true
          enum: [lapsed, paused, no_payment_method]
          description: Why takingBookings is false. Null while it is true.
        whatsapp:
          type: string
          nullable: true
          description: |
            The owner's number, so guests can message them while the plan is lapsed. Only set
            when pausedReason is lapsed.

    PublicPhoto:
      type: object
      required: [url, caption]
      properties:
        url:
          type: string
          format: uri
        caption:
          type: string

    PublicUnit:
      type: object
      required: [id, name, sleeps, beds, linkedUnitIds]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sleeps:
          type: integer
        beds:
          type: string
        linkedUnitIds:
          type: array
          items:
            type: string
            format: uuid

    PublicExtra:
      type: object
      required: [id, name, price, per, onRequest]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        price:
          $ref: "#/components/schemas/Money"
        per:
          $ref: "#/components/schemas/ExtraPer"
        onRequest:
          type: boolean

    PublicBookingSettings:
      type: object
      required: [mode, holdMinutes]
      properties:
        mode:
          type: string
          enum: [instant, request]
        holdMinutes:
          type: integer

    PublicPayments:
      type: object
      required: [bank, atProperty]
      properties:
        bank:
          type: boolean
          description: Guests can pay by bank transfer.
        atProperty:
          type: boolean
        card:
          $ref: "#/components/schemas/PublicCard"

    PublicCard:
      type: object
      description: Present when guests can pay by card through Payments.lk.
      required: [charge, testMode]
      properties:
        charge:
          type: string
          enum: [deposit, full]
          description: What a card pays when booking.
        rate:
          type: integer
          format: int64
          description: Rupee cents per 1.00 of the property's currency; absent for LKR.
        testMode:
          type: boolean
          description: The checkout is a sandbox; no real money moves.

    PublicBranding:
      type: object
      required: [color]
      properties:
        color:
          type: string
        logoUrl:
          type: string
          format: uri

    Availability:
      type: object
      required: [units]
      properties:
        units:
          type: array
          items:
            $ref: "#/components/schemas/UnitAvailability"

    UnitAvailability:
      type: object
      required: [unitId, taken, closedArrival]
      properties:
        unitId:
          type: string
          format: uuid
        taken:
          type: array
          description: Nights that can't be booked.
          items:
            $ref: "#/components/schemas/Day"
        closedArrival:
          type: array
          description: Days guests can't arrive on.
          items:
            $ref: "#/components/schemas/Day"

    PublicQuoteRequest:
      type: object
      required: [unitId, checkIn, checkOut, adults]
      properties:
        unitId:
          type: string
          format: uuid
        checkIn:
          $ref: "#/components/schemas/Day"
        checkOut:
          $ref: "#/components/schemas/Day"
        adults:
          type: integer
          minimum: 1
          maximum: 30
        children:
          type: integer
          minimum: 0
          maximum: 30
        extras:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        promo:
          type: string
          maxLength: 40

    NewHold:
      type: object
      required: [unitId, checkIn, checkOut]
      properties:
        unitId:
          type: string
          format: uuid
        checkIn:
          $ref: "#/components/schemas/Day"
        checkOut:
          $ref: "#/components/schemas/Day"
        replaces:
          type: string
          format: uuid
          description: The guest's previous hold, released first.

    Hold:
      type: object
      required: [holdId, expiresAt]
      properties:
        holdId:
          type: string
          format: uuid
        expiresAt:
          type: string
          format: date-time

    GuestPaymentMethod:
      type: string
      enum: [bank, property, card]
      description: How a guest who booked on the page said they'd pay.

    GuestBookingRequest:
      type: object
      required: [unitId, checkIn, checkOut, adults, guest, paymentMethod, source]
      properties:
        holdId:
          type: string
          format: uuid
        unitId:
          type: string
          format: uuid
        checkIn:
          $ref: "#/components/schemas/Day"
        checkOut:
          $ref: "#/components/schemas/Day"
        adults:
          type: integer
          minimum: 1
          maximum: 30
        children:
          type: integer
          minimum: 0
          maximum: 30
        extras:
          type: array
          maxItems: 50
          items:
            type: string
            format: uuid
        promo:
          type: string
          maxLength: 40
        guest:
          $ref: "#/components/schemas/Guest"
        note:
          type: string
          maxLength: 2000
        paymentMethod:
          $ref: "#/components/schemas/GuestPaymentMethod"
        source:
          type: string
          enum: [page, widget]

    GuestBookingCreated:
      type: object
      required: [booking, token]
      properties:
        booking:
          $ref: "#/components/schemas/GuestBooking"
        token:
          type: string
          description: Send as X-Booking-Token to see the booking again. Shown once.

    GuestBooking:
      type: object
      description: |
        A booking as its guest sees it. It leaves out the guest record, which may be one the
        owner already had for that phone number.
      required: [id, ref, status, propertyName, propertySlug, propertyCheckIn, unitName, checkIn,
                 checkOut, adults, children, currency, lines, total, deposit, paid, balance, slips]
      properties:
        id:
          type: string
          format: uuid
        ref:
          type: string
        status:
          $ref: "#/components/schemas/BookingStatus"
        propertyName:
          type: string
        propertySlug:
          $ref: "#/components/schemas/Slug"
        propertyCheckIn:
          $ref: "#/components/schemas/Clock"
        unitName:
          type: string
        checkIn:
          $ref: "#/components/schemas/Day"
        checkOut:
          $ref: "#/components/schemas/Day"
        adults:
          type: integer
        children:
          type: integer
        currency:
          $ref: "#/components/schemas/Currency"
        lines:
          type: array
          items:
            $ref: "#/components/schemas/PriceLine"
        total:
          $ref: "#/components/schemas/Money"
        deposit:
          $ref: "#/components/schemas/Money"
        paid:
          $ref: "#/components/schemas/Signed"
        balance:
          $ref: "#/components/schemas/Money"
        paymentMethod:
          $ref: "#/components/schemas/GuestPaymentMethod"
        paymentDueAt:
          type: string
          format: date-time
        requestExpiresAt:
          type: string
          format: date-time
        bank:
          $ref: "#/components/schemas/GuestBank"
        card:
          $ref: "#/components/schemas/GuestCard"
        slips:
          type: array
          items:
            $ref: "#/components/schemas/GuestSlip"

    GuestCard:
      type: object
      description: What the guest can pay by card now. Present when the property takes cards.
      required: [testMode, options]
      properties:
        testMode:
          type: boolean
        options:
          type: array
          items:
            $ref: "#/components/schemas/CardOption"

    CardOption:
      type: object
      required: [purpose, amount, charged]
      properties:
        purpose:
          $ref: "#/components/schemas/CardPurpose"
        amount:
          $ref: "#/components/schemas/Money"
        charged:
          type: integer
          format: int64
          description: The same in rupee cents, what the card is charged.

    CardPurpose:
      type: string
      enum: [deposit, full, balance]

    CardCheckoutRequest:
      type: object
      required: [purpose]
      properties:
        purpose:
          $ref: "#/components/schemas/CardPurpose"

    CardCheckout:
      type: object
      required: [url, amount, currency, charged, chargedCurrency, testMode]
      properties:
        url:
          type: string
          description: The hosted checkout to send the guest to.
        amount:
          $ref: "#/components/schemas/Money"
        currency:
          $ref: "#/components/schemas/Currency"
        charged:
          type: integer
          format: int64
        chargedCurrency:
          $ref: "#/components/schemas/Currency"
        testMode:
          type: boolean

    GuestBank:
      type: object
      description: Where to transfer, for guests paying by bank transfer.
      required: [bankName, accountName, accountNumber]
      properties:
        bankName:
          type: string
        accountName:
          type: string
        accountNumber:
          type: string

    GuestSlip:
      type: object
      required: [amount, status, uploadedAt]
      properties:
        amount:
          $ref: "#/components/schemas/Money"
        status:
          type: string
          enum: [pending, accepted, rejected]
        uploadedAt:
          type: string
          format: date-time

    GuestUploadRequest:
      type: object
      required: [contentType, size]
      properties:
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp, image/heic]
        size:
          type: integer
          format: int64
          minimum: 1
          description: Exact size in bytes, up to 10 MB.

    GuestSlipInput:
      type: object
      required: [key, amount]
      properties:
        key:
          type: string
          maxLength: 300
          description: The key from the booking's uploads.
        amount:
          $ref: "#/components/schemas/Money"

    BookingStatus:
      type: string
      enum: [requested, awaiting_payment, confirmed, checked_in, checked_out, cancelled, declined]

    BookingSource:
      type: string
      description: Where the stay came from. airbnb, booking, agoda and expedia arrive by iCal.
      enum: [page, widget, whatsapp, phone, walkin, other, airbnb, booking, agoda, expedia]

    PaymentMethod:
      type: string
      enum: [bank, cash, card]

    Signed:
      type: integer
      format: int64
      description: An amount in minor units that may be negative, such as a discount.

    Guest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        phone:
          type: string
          maxLength: 32
        email:
          type: string
          maxLength: 254
        country:
          type: string
          description: ISO 3166 two-letter code.
          maxLength: 2

    PriceLine:
      type: object
      required: [label, amount]
      properties:
        label:
          type: string
        amount:
          $ref: "#/components/schemas/Signed"
        kind:
          type: string
          enum: [discount, charge, extra]

    Payment:
