      type: object
      required: [url, amount, currency]
      properties:
        url:
          type: string
          description: The hosted checkout to send the owner to.
        amount:
          type: integer
          format: int64
        currency:
          $ref: "#/components/schemas/Currency"

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: slug_taken
        message:
          type: string
          example: That booking page address is already taken.
        field:
          type: string
          description: The request field the error is about, when there is one.
          example: slug
        retryAfter:
          type: integer
          description: Seconds to wait before retrying, on 429 responses.
