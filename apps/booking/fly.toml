# Booking pages on *.staykey.direct, which also serves cdn.staykey.direct/widget.js. First deploy
# and secrets: docs/RUNBOOK.md, "First deploy". From the repo root:
#
#   fly deploy . --config apps/booking/fly.toml --dockerfile apps/booking/Dockerfile \
#     --build-arg STAYKEY_RELEASE=$(git rev-parse --short HEAD) \
#     --build-secret SENTRY_AUTH_TOKEN=<token>
#
# Nothing secret lives in this file.

app = "staykey-booking"
primary_region = "sin"

[build.args]
  STAYKEY_ENVIRONMENT = "production"
  NEXT_PUBLIC_ROOT_DOMAIN = "staykey.direct"

[env]
  STAYKEY_API_URL = "https://api.staykey.direct"
  STAYKEY_ENVIRONMENT = "production"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
